name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday at 03:00 UTC
  workflow_dispatch: # allows manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          output-path: profile/streak-stats.svg
          theme: default
          hide-border: true

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed files directly (signed via Contents API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          for f in profile/streak-stats.svg profile/stats.svg profile/top-langs.svg; do
            [ -f "$f" ] || continue

            remote_json=$(gh api "repos/$REPO/contents/$f?ref=main" 2>/dev/null) || remote_json=""

            if [ -n "$remote_json" ]; then
              remote_sha=$(echo "$remote_json" | jq -r '.sha')
              if echo "$remote_json" | jq -r '.content' | tr -d '\n' | base64 -d | cmp -s - "$f"; then
                echo "No change: $f"
                continue
              fi
              sha_args=(-f "sha=$remote_sha")
            else
              sha_args=()
            fi

            content_b64=$(base64 -w0 "$f")
            gh api --method PUT "repos/$REPO/contents/$f" \
              -f "message=chore: update $(basename "$f")" \
              -f "content=$content_b64" \
              -f "branch=main" \
              "${sha_args[@]}"
            echo "Updated: $f"
          done
